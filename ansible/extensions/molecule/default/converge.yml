---
# A consumer's play, in miniature: the fleet-wide inputs come from group_vars (see
# molecule.yml), each app's own from the role call. Both kinds are here, and the
# 'source' app ships one of everything it can ship — a Quadlet, a plain unit, and a
# nested config tree — because what the manifest records is what the next deploy prunes.
- name: Converge
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Every unit the role calls below manage, for the post-task report.
    molecule_managed_units:
      - molsource.service
      - molsource-extra.service
      - molinline.service

  roles:
    # First, so the network unit exists before anything that might reference it.
    - role: systemd_app
      systemd_app_kind: source
      systemd_app_name: molnet

    - role: systemd_app
      systemd_app_kind: source
      systemd_app_name: molsource
      systemd_app_enable_units:
        - molsource.service
        - molsource-extra.service
      systemd_app_domain: molsource.molecule.test

    - role: systemd_app
      systemd_app_kind: inline
      systemd_app_name: molinline
      systemd_app_description: Molecule fixture inline container
      systemd_app_image: "{{ molecule_image }}"
      systemd_app_domain: molinline.molecule.test
      # A value with a space, so the rendered unit exercises the quoting in
      # systemd_env_lines rather than only the trivial path through it.
      systemd_app_env:
        MOLECULE_GREETING: hello world
      systemd_app_container_options:
        - Exec=sleep 86400
      systemd_app_data_dirs:
        - path: data
          owner: "10001"
          group: "10001"
          mode: "0700"

  post_tasks:
    # An idempotence failure names only the task that reported 'changed', and for the
    # unit tasks that is nearly always a unit that did not stay up — a container that
    # exited, with Restart=always cycling it. Reported on every converge, so the log of
    # the run that fails already carries the reason and needs no second run to find it.
    - name: Collect the state of the managed units
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ molecule_unit }}"]
      loop: "{{ molecule_managed_units }}"
      loop_control:
        loop_var: molecule_unit
      changed_when: false
      failed_when: false
      register: molecule_unit_state

    - name: Report the state of the managed units
      ansible.builtin.debug:
        msg: "{{ molecule_unit_state.results | map(attribute='molecule_unit') | zip(molecule_unit_state.results | map(attribute='stdout')) | list }}"

    - name: Collect the journal of every unit that is not running
      ansible.builtin.command:
        argv: [journalctl, --no-pager, --lines, "40", --unit, "{{ molecule_unit.molecule_unit }}"]
      loop: "{{ molecule_unit_state.results | rejectattr('stdout', 'equalto', 'active') | list }}"
      loop_control:
        loop_var: molecule_unit
        label: "{{ molecule_unit.molecule_unit }}"
      changed_when: false
      failed_when: false
      register: molecule_unit_journal

    - name: Report the journal of every unit that is not running
      ansible.builtin.debug:
        msg: "{{ molecule_unit_journal.results | map(attribute='stdout_lines') | list }}"
      when: molecule_unit_journal.results | length > 0
