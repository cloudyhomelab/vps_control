---
- name: Update Debian packages
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Packages to ensure are present on the host. Extend as needed.
    packages:
      - aardvark-dns
      - catatonit
      - fuse-overlayfs
      - nftables
      - passt
      - podman
      - uidmap

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Upgrade all packages to latest version
      ansible.builtin.apt:
        upgrade: dist
        autoremove: true
        autoclean: true
      register: upgrade_result

    - name: Print upgrade summary
      ansible.builtin.debug:
        msg: "Upgraded packages: {{ upgrade_result.stdout_lines | default(['No output']) }}"

    - name: Ensure required packages are installed
      ansible.builtin.apt:
        name: "{{ packages }}"
        state: present
      register: install_result

    - name: Print installed packages
      ansible.builtin.debug:
        msg: "Ensured present: {{ packages | join(', ') }}"

    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file

    # The record that a reboot happened this week: the 'summary' tag puts this notice on
    # the run page (see callback_plugins/github_summary.py), which the recap alone cannot
    # say — it counts tasks without naming them. Conditional, so the notice shows up in
    # the summary of the runs that rebooted and in no others.
    - name: Notify that a reboot is needed
      ansible.builtin.debug:
        msg: "NOTICE: a reboot is required on {{ inventory_hostname }} — rebooting now."
      when: reboot_required_file.stat.exists
      tags: summary

    # Unattended on purpose: leaving a kernel unapplied on an internet-facing host is
    # worse than a minute of downtime inside the weekly window, and every container
    # comes back by itself (Restart=always plus an [Install] section). The condition is
    # Debian's own reboot-required marker, so this fires only when it means something —
    # in practice monthly, not weekly. To patch without rebooting, run with --check.
    #
    # The module waits for the host and fails the job if it does not return, which is
    # what makes a bad boot a red scheduled run rather than a silent outage.
    - name: Reboot if required
      ansible.builtin.reboot:
        msg: "Reboot triggered by Ansible after package update"
        reboot_timeout: 600
        post_reboot_delay: 15
        test_command: uptime
      when: reboot_required_file.stat.exists
