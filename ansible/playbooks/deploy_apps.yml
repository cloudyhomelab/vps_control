---
- name: Deploy Podman Quadlet apps
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Where this repository keeps its app definitions, one directory per app name —
    # read by every 'source' app below, and by either kind's secrets lookup. The role
    # has no default for it, the location being a property of this repository rather
    # than of the role, so it is set once here for every app in the play.
    systemd_app_apps_dir: "{{ playbook_dir }}/../apps"

    # How often `podman auto-update` checks the registry for the AutoUpdate=registry
    # containers. Every 2h is 3 manifest requests per image per 6h window, well
    # inside Docker Hub's 100-per-6h ceiling for the anonymous pulls these use.
    podman_auto_update_oncalendar: "*-*-* 0/2:00:00"

  roles:
    # Deploy the shared network first so it exists before any container that
    # joins it (Network=web.network) is started.
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: shared

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: reverse_proxy
      systemd_app_enable_units:
        - caddy.service

    # Every routed app follows reverse_proxy: registering a route writes into the state
    # directory caddy.service mounts, so the proxy is converged before anything adds to it.
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: calculators
      systemd_app_description: Calculators web app
      systemd_app_image: docker.io/binarycodes/calculators:latest
      systemd_app_domain: calc.cloudyhome.org
      systemd_app_env:
        FORWARD_HEADERS_STRATEGY: native
      systemd_app_health_cmd: "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: nasplan
      systemd_app_image: docker.io/binarycodes/make-my-nas:latest
      systemd_app_port: 8080
      systemd_app_domain: nasplan.cloudyhome.org
      systemd_app_health_cmd: "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: whichday
      systemd_app_enable_units:
        - whichday.service
      systemd_app_domain: whichday.cloudyhome.org
      systemd_app_data_dirs:
        - path: data
          owner: "10001"
          group: "10001"
          mode: "0700"

    # Host upkeep, not an app: a weekly timer reclaiming the images auto-update leaves
    # untagged. No quadlet/ or config/ of its own, just the two systemd units.
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: maintenance
      systemd_app_enable_units:
        - podman-prune.timer

  post_tasks:
    # Per-app roles write route snippets but Caddy only applies them on reload,
    # so reload once centrally after all apps are converged. Reload, not restart,
    # to keep existing connections up.
    - name: Reload Caddy to apply route changes
      ansible.builtin.systemd:
        name: caddy.service
        state: reloaded

    # Host-wide timer that runs `podman auto-update` refreshing every container marked AutoUpdate=registry.
    # A drop-in rather than a replacement unit, so upstream changes to the rest of
    # the timer still apply. Not installable through the systemd_app role: that role
    # copies flat files into its own two install dirs and its manifest allowlist
    # refuses subdirectory paths, which is what a .timer.d/ drop-in is.
    - name: Ensure the Podman auto-update timer drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/podman-auto-update.timer.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The bare OnCalendar= is load-bearing: OnCalendar accumulates, so without
    # clearing the vendor's daily value first this would add a second schedule
    # rather than replace it. The delay spreads the pull across the window instead
    # of firing on an exact clock boundary, where it could meet a deploy run.
    - name: Set the Podman auto-update check interval
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-auto-update.timer.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Timer]
          OnCalendar=
          OnCalendar={{ podman_auto_update_oncalendar }}
          RandomizedDelaySec=1800

    - name: Enable the Podman auto-update timer
      ansible.builtin.systemd:
        name: podman-auto-update.timer
        enabled: true
        state: started
        daemon_reload: true
