---
- name: Deploy Podman Quadlet apps
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Where this repository keeps its app definitions, one directory per app name
    systemd_app_apps_dir: "{{ playbook_dir }}/../apps"

    # How often `podman auto-update` checks the registry for the AutoUpdate=registry containers
    podman_auto_update_oncalendar: "*-*-* 0/2:00:00"

  roles:
    # Deploy the shared network first so it exists before any container that
    # joins it (Network=web.network) is started.
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: shared

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: reverse_proxy
      systemd_app_enable_units:
        - caddy.service

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: calculators
      systemd_app_description: Calculators web app
      systemd_app_image: docker.io/binarycodes/calculators:latest
      systemd_app_domain: calc.cloudyhome.org
      systemd_app_env:
        FORWARD_HEADERS_STRATEGY: native
      systemd_app_health_cmd: "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: nasplan
      systemd_app_image: docker.io/binarycodes/make-my-nas:latest
      systemd_app_domain: nasplan.cloudyhome.org
      systemd_app_health_cmd: "wget -qO /dev/null http://127.0.0.1:8080/ || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: whichday
      systemd_app_enable_units:
        - whichday.service
      systemd_app_domain: whichday.cloudyhome.org
      systemd_app_data_dirs:
        - path: data
          owner: "10001"
          group: "10001"
          mode: "0700"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: frankfurter-mcp
      systemd_app_image: docker.io/binarycodes/frankfurter-mcp:latest
      systemd_app_domain: frankfurter-mcp.cloudyhome.org
      systemd_app_health_cmd: "curl -sS -o /dev/null http://127.0.0.1:8080/mcp || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: inline
      systemd_app_name: binarycodes-dev-blog
      systemd_app_description: binarycodes - dev blog
      systemd_app_image: docker.io/binarycodes/mkdocs-dev-blog:latest
      systemd_app_domain: blog.binarycodes.dev
      systemd_app_port: 8000
      systemd_app_health_cmd: "wget -qO /dev/null http://127.0.0.1:8000/ || exit 1"

    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: gatus
      systemd_app_enable_units:
        - gatus.service
      systemd_app_domain: status.cloudyhome.org
      systemd_app_data_dirs:
        - path: data
          mode: "0700"

    # All maintenance related units/quadlets/service goes here
    - role: binarycodes.homelab.systemd_app
      systemd_app_kind: source
      systemd_app_name: maintenance
      systemd_app_enable_units:
        - podman-prune.timer

  post_tasks:
    # Per-app roles write route snippets but Caddy only applies them on reload,
    # so reload once centrally after all apps are converged. Reload, not restart,
    # to keep existing connections up
    - name: Reload Caddy to apply route changes
      ansible.builtin.systemd:
        name: caddy.service
        state: reloaded

    # Timer that runs `podman auto-update` refreshing every container marked AutoUpdate=registry
    - name: Ensure the Podman auto-update timer drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/podman-auto-update.timer.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    # OnCalendar accumulates, so the first entry clears the default value
    - name: Set the Podman auto-update check interval
      ansible.builtin.copy:
        dest: /etc/systemd/system/podman-auto-update.timer.d/override.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Timer]
          OnCalendar=
          OnCalendar={{ podman_auto_update_oncalendar }}
          RandomizedDelaySec=1800

    - name: Enable the Podman auto-update timer
      ansible.builtin.systemd:
        name: podman-auto-update.timer
        enabled: true
        state: started
        daemon_reload: true
