---
argument_specs:
  main:
    short_description: Deploy or decommission one app — files from a directory (source) or a rendered single container (simple) — plus its route.
    options:
      application_kind:
        type: str
        required: true
        choices: [source, simple]
        description: >-
          source installs an app's Quadlet files, systemd units, and config tree
          from a controller directory; simple renders a single-container Quadlet
          from inline params (application_image, application_env, ...). Required.
      application_state:
        type: str
        required: false
        default: present
        choices: [present, absent]
        description: >-
          present deploys the app and starts its units, removing files a previous
          deploy installed and this one does not; absent stops those units and removes
          everything the app owns on the host — Quadlet files, systemd units, Caddy
          route, and its config/data directory (then delete the role call). absent is
          destructive and not reversible; back the app up first.
      application_name:
        type: str
        required: true
        description: >-
          source: app directory name under application_apps_dir. simple: container
          name, Quadlet basename, and network DNS name the reverse proxy resolves.
      application_enable_units:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          systemd unit names to enable at boot and start now. A simple app defaults
          to its single <name>.service when none are given.
      application_image:
        type: str
        required: false
        description: >-
          simple kind only. Full image reference, e.g. docker.io/org/app:latest.
          Required when application_kind is simple and state is present (enforced
          in the role); not needed for source apps or for absent.
      application_description:
        type: str
        required: false
        description: simple kind only. Unit description (default "<name> container").
      application_network:
        type: str
        required: false
        default: web.network
        description: simple kind only. Podman network the rendered container joins.
      application_env:
        type: dict
        required: false
        default: {}
        description: simple kind only. Environment variables rendered as Environment= lines.
      application_volumes:
        type: list
        elements: str
        required: false
        default: []
        description: simple kind only. Raw Quadlet Volume= values.
      application_publish_ports:
        type: list
        elements: str
        required: false
        default: []
        description: simple kind only. Raw Quadlet PublishPort= values for apps that need a host port.
      application_container_options:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          simple kind only. Raw lines appended to the [Container] section, for Quadlet
          keys this role has no parameter of its own (e.g. HealthCmd=, Notify=).
      application_service_options:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          simple kind only. Raw lines appended to the [Service] section, for unit keys
          this role has no parameter of its own.
      application_data_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Directories to create before the container starts, for bind mounts the app
          writes to itself — podman would create the host path as root:root, which an
          unprivileged container cannot write in. Paths are relative to the app's own state
          dir, and are removed with it on absent.
        options:
          path:
            type: str
            required: true
            description: >-
              Path relative to the app's state dir (application_config_root/<app>), e.g.
              'data'. Absolute paths and '..' are refused.
          owner:
            type: str
            required: false
            description: Owner, normally the numeric uid the image runs as (default root).
          group:
            type: str
            required: false
            description: Group, normally the numeric gid the image runs as (default root).
          mode:
            type: str
            required: false
            description: Permissions (default application_dir_mode).
      application_health_cmd:
        type: str
        required: false
        default: ''
        description: >-
          simple kind only. Healthcheck command run inside the container — an HTTP
          request, pg_isready, whatever fits the app. Setting it emits the whole health
          block plus Notify=healthy, so a bad image fails to start and podman
          auto-update rolls it back. Empty means no healthcheck.
      application_health_interval:
        type: str
        required: false
        default: 15s
        description: simple kind only. Time between probes once the container is up.
      application_health_retries:
        type: int
        required: false
        default: 3
        description: simple kind only. Consecutive failures before the container is unhealthy.
      application_health_start_period:
        type: str
        required: false
        default: 60s
        description: >-
          simple kind only. Grace window after start during which a failing probe does
          not count against the retries.
      application_start_timeout:
        type: int
        required: false
        default: 180
        description: >-
          simple kind only. TimeoutStartSec for the unit, applied when a health command
          is set — Notify=healthy turns it into the deadline for the first passing probe.
      application_domain:
        type: str
        required: false
        description: >-
          Public hostname. When set, a Caddy route (domain -> upstream:port) is
          written to the imported conf.d directory.
      application_upstream:
        type: str
        required: false
        description: >-
          Upstream container name the route proxies to, as resolved on the shared
          network. Defaults to application_name; override when the routable
          container is named differently.
      application_port:
        type: int
        required: false
        default: 8080
        description: Internal upstream port for the Caddy route.
