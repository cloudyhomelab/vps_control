---
# Deploys (state=present) or decommissions (state=absent) one app. Two kinds:
#   source -> install Quadlet files, systemd units, and a config tree from a
#             controller directory ({{ application_apps_dir }}/<name>/).
#   simple -> render a single-container Quadlet from inline params (image, env, ...).
# Both kinds optionally register a Caddy route. See README + defaults/main.yml.

- name: Validate role input
  ansible.builtin.assert:
    that:
      - application_name is defined
      - application_name | string | length > 0
      # The name composes every install path and, on absent, a recursive delete of
      # {{ application_config_root }}/<name>, so it must be one plain path segment:
      # a slash or a leading dot would let that delete escape the app's own directory.
      - application_name is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      - application_kind is defined
      - application_kind in ['source', 'simple']
      # 'simple' renders from an image, so present requires one (absent does not).
      - application_kind != 'simple' or application_state == 'absent' or (application_image is defined and (application_image | string | length > 0))
    fail_msg: >-
      The 'application' role requires 'application_name' (letters, digits, dot, dash
      or underscore, not starting with a dot) and 'application_kind' (source|simple);
      a 'simple' app being deployed (state=present) also requires 'application_image'.
    quiet: true

# The values checked below are interpolated into files this role generates rather than
# passed to a module, so a stray character does not fail the task that writes them. Caddy
# refuses a whole imported config, which takes every other app's route down with one bad
# domain, and systemd mis-parses an Environment= line into a different variable without
# complaining. Checked here, alongside the rest of the input, so a typo at a call site is a
# failed run rather than a half-deployed app or a proxy that will not load.
#
# Both filters return one string per problem, so a run reports everything wrong at once
# rather than the first thing. What each accepts, and why, is in filter_plugins/application.py.
- name: "Verify the route inputs of app {{ application_name }}"
  ansible.builtin.assert:
    that:
      - application_route_problems | length == 0
    fail_msg: >-
      App {{ application_name }} cannot be routed as given:
      {{ application_route_problems | join('; ') }}.
    quiet: true
  vars:
    application_route_problems: >-
      {{ application_domain | route_problems(application_upstream, application_port) }}
  when:
    - application_state == 'present'
    - application_domain is defined
    - application_domain | string | length > 0

- name: "Verify the rendered container inputs of app {{ application_name }}"
  ansible.builtin.assert:
    that:
      - application_container_problems | length == 0
    fail_msg: >-
      App {{ application_name }} has values that would not survive into its Quadlet:
      {{ application_container_problems | join('; ') }}.
    quiet: true
  vars:
    application_container_problems: >-
      {{ application_env | container_problems(application_description | default(''),
         application_volumes, application_publish_ports,
         application_container_options, application_service_options) }}
  when:
    - application_state == 'present'
    - application_kind == 'simple'

# A 'source' app installs from this directory, and every variable that reads it
# (application_source_quadlet_files and its two siblings) is a fileglob, which returns an
# empty list for a path that is not there rather than failing. So a wrong
# application_apps_dir installs nothing and still reports success — and worse, on an app
# already deployed, present.yml reads that empty set as "the app has stopped shipping
# these files" and prunes every path the last deploy recorded. Checked here, before
# either can happen.
#
# Only on the present path: a decommission works from the manifest on the host alone, so
# it has to keep working once the app's source tree is gone.
- name: "Verify source directory of app {{ application_name }}"
  when:
    - application_kind == 'source'
    - application_state == 'present'
  block:
    - name: "Stat source directory of app {{ application_name }}"
      ansible.builtin.stat:
        path: "{{ application_apps_dir }}/{{ application_name }}"
      delegate_to: localhost
      become: false
      register: application_source_dir_stat

    - name: "Refuse a source app with no source directory: {{ application_name }}"
      ansible.builtin.assert:
        that:
          - application_source_dir_stat.stat.exists
          - application_source_dir_stat.stat.isdir
        fail_msg: >-
          'source'-kind app {{ application_name }} has no directory at
          {{ application_apps_dir }}/{{ application_name }}. Deploying it would install
          nothing and still report success, and on an app already on the host it would
          remove every file the last deploy installed. Check application_apps_dir: its
          default is relative to the invoked playbook's own location, so it moves when
          the playbook does.
        quiet: true

# Facts and registers both persist for the rest of the play, and this role runs once
# per app, so everything path-shaped is cleared here — an app must never inherit
# another app's paths from an earlier invocation in the same run, least of all into a
# task that deletes them. application_config_found is included because its `find` is
# skipped for apps with no config tree, which would otherwise leave the previous app's
# file list standing. application_source_dir_stat has already been consumed by the assert
# above, and is cleared all the same, so nothing added later can read another app's result.
#
# The secret facts are here for the same reason and matter as much: the decrypted values
# of one app must never be visible to the next, the digest read is skipped for an app with
# no record and the store listing for an app with no secrets, so a stale register would make
# this app's secrets look already-stored — or already-present on the host — and a stale
# create result would restart an app that rotated nothing. The install registers are
# here for that last reason too: each is skipped for the kind — or the app — that does not
# use it, so one app's file changes would otherwise decide how the next app is reloaded.
- name: "Reset install path facts for app {{ application_name }}"
  ansible.builtin.set_fact:
    application_manifest_paths: []
    application_installed_paths: []
    application_source_dir_stat: {}
    application_config_found: {}
    application_secrets_stat: {}
    application_secret_load: {}
    application_secret_reconciled: {store: [], drop: [], remove: []}
    application_secret_digest_stat: {}
    application_secret_digest_slurp: {}
    application_secret_store_list: {}
    application_secret_create: {}
    application_quadlet_render: {}
    application_quadlet_install: {}
    application_unit_install: {}
    application_config_deploy: {}
    application_start_result: {}
    application_restart_needed: false
    application_config_changed: false

- name: "Deploy app {{ application_name }}"
  ansible.builtin.include_tasks: present.yml
  when: application_state == 'present'

- name: "Decommission app {{ application_name }}"
  ansible.builtin.include_tasks: absent.yml
  when: application_state == 'absent'
