---
# Loads the host paths recorded by the last deploy of a 'source' app into
# application_manifest_paths, leaving it at the empty default from main.yml when the
# app has no manifest here. Included by present.yml, which prunes the recorded paths
# it no longer installs, and by absent.yml, which removes all of them.

- name: "Stat install manifest for app {{ application_name }}"
  ansible.builtin.stat:
    path: "{{ application_manifest_file }}"
  register: application_manifest_stat

- name: "Read install manifest for app {{ application_name }}"
  ansible.builtin.slurp:
    src: "{{ application_manifest_file }}"
  register: application_manifest_slurp
  when: application_manifest_stat.stat.exists

- name: "Load recorded paths from manifest for app {{ application_name }}"
  when: application_manifest_stat.stat.exists
  vars:
    application_manifest_lines: >-
      {{ (application_manifest_slurp.content | b64decode).splitlines()
         | map('trim') | select('match', '.') | list }}
    # A single path segment directly under one of the install dirs. '.' and '..'
    # are excluded because 'file: state=absent' deletes a directory recursively,
    # so either would take every app's files with it.
    application_manifest_allowed_re: >-
      ^({{ [application_system_dir, application_unit_dir] | map('regex_escape') | join('|') }})/(?!\.\.?$)[^/]+$
  block:
    # Callers act on these paths as root, so a corrupt or tampered manifest must
    # not be able to reach files outside what this role installs. Refuse the whole
    # manifest rather than silently skipping the odd entry.
    - name: "Refuse out-of-allowlist manifest paths for app {{ application_name }}"
      ansible.builtin.assert:
        that:
          - application_manifest_lines | reject('match', application_manifest_allowed_re) | list | length == 0
        fail_msg: >-
          Manifest {{ application_manifest_file }} lists paths outside this role's
          install directories ({{ application_system_dir }}, {{ application_unit_dir }}):
          {{ application_manifest_lines | reject('match', application_manifest_allowed_re) | list }}.
          Refusing to remove anything — the manifest may be corrupt or tampered with.
        quiet: true

    - name: "Record paths installed by the previous deploy of app {{ application_name }}"
      ansible.builtin.set_fact:
        application_manifest_paths: "{{ application_manifest_lines }}"
