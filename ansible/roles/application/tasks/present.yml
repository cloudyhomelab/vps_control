---
# Secrets: an app that needs any ships apps/<app>/secrets.sops.yaml, keyed by the podman
# secret names. Found rather than declared, like the app's quadlet/ and config/
# directories, so that file is the only place the set is written down. First in the file
# because a 'simple' app's Quadlet is rendered from those names below.
- name: "Check for encrypted secrets of app {{ application_name }}"
  ansible.builtin.stat:
    path: "{{ application_secrets_file }}"
  delegate_to: localhost
  become: false
  register: application_secrets_stat

# Decrypted on the controller; the values reach the host only through the secret store
# below. no_log because the result carries them and the deploy runs with -v, which prints
# task results.
- name: "Load encrypted secrets of app {{ application_name }}"
  community.sops.load_vars:
    file: "{{ application_secrets_file }}"
    name: application_secret_values
    # Pinned rather than left on 'auto', so what this returns does not change with the
    # controller's ansible-core version.
    return_method: facts-only
  register: application_secret_load
  no_log: true
  when: application_secrets_stat.stat.exists

# Taken from the register rather than used where the task above put it: main.yml clears
# the per-app facts with set_fact, whose precedence beats a fact returned by a later task,
# so that empty default would shadow the loaded values for the whole run. Assigning here
# also means this runs for every app, and one app's secrets can never carry into the
# next — an app with no encrypted file lands back on the empty default.
- name: "Collect the decrypted secrets of app {{ application_name }}"
  ansible.builtin.set_fact:
    application_secret_values: >-
      {{ application_secret_load.ansible_facts.application_secret_values | default({}, true) }}
  no_log: true

- name: "Verify every secret can be stored for app {{ application_name }}"
  ansible.builtin.assert:
    that:
      # Passed to `podman secret` as root, and useful only if a Quadlet can reference it.
      - item.key is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      # A 'simple' app's Secret= line is rendered from this key, so the key also has to
      # spell a legal environment variable once upper-cased — no dots, no leading digit.
      - application_kind != 'simple' or item.key is match('^[A-Za-z][A-Za-z0-9-]*$')
      # Refused here rather than at container start, where an empty value surfaces as the
      # app failing to boot with no explanation of why.
      - item.value is not none and (item.value | string | length > 0)
    fail_msg: >-
      {{ application_name }}/secrets.sops.yaml must map podman secret names (letters,
      digits, dot, dash or underscore, not starting with a dot) to non-empty values. For a
      'simple' app the name is also the variable the container sees, upper-cased with
      dashes as underscores, so it is limited to letters, digits and dashes.
    quiet: true
  loop: "{{ application_secret_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# 'simple' kind: render the single-container Quadlet from inline params. 'source'
# kind installs its container from a file instead (the copy tasks below).
- name: "Render Quadlet for container {{ application_name }}"
  ansible.builtin.template:
    src: container.container.j2
    dest: "{{ application_system_dir }}/{{ application_name }}.container"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"
  when: application_kind == 'simple'
  register: application_quadlet_render
  notify: Reload systemd

# What the last deploy installed, so the files below can be reconciled against it. Read
# for either kind, and that is what makes a change of kind converge: the paths recorded
# by a 'source' deploy are exactly what the 'simple' one it became has to prune, and the
# other way round.
- name: "Read recorded install manifest for app {{ application_name }}"
  ansible.builtin.include_tasks: read-manifest.yml

- name: "Install Quadlet files for app {{ application_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ application_system_dir }}/"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"
  loop: "{{ application_source_quadlet_files }}"
  when: application_kind == 'source'
  register: application_quadlet_install
  notify: Reload systemd

- name: "Install systemd units for app {{ application_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ application_unit_dir }}/"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"
  loop: "{{ application_source_unit_files }}"
  when: application_kind == 'source'
  register: application_unit_install
  notify: Reload systemd

- name: "Check for config directory of app {{ application_name }}"
  ansible.builtin.stat:
    path: "{{ application_source_config_dir }}"
  delegate_to: localhost
  become: false
  register: application_config_dir

# Recursive, because a config tree nests and fileglob sees only one level down. The
# manifest has to list every file the copy below installs, or the next deploy prunes
# something it should have kept.
- name: "Find config files of app {{ application_name }}"
  ansible.builtin.find:
    paths: "{{ application_source_config_dir }}"
    recurse: true
    hidden: true
    file_type: file
  delegate_to: localhost
  become: false
  register: application_config_found
  when:
    - application_kind == 'source'
    - application_config_dir.stat.exists
    - application_config_dir.stat.isdir

- name: "Deploy config tree for app {{ application_name }}"
  ansible.builtin.copy:
    src: "{{ application_source_config_dir }}/"
    dest: "{{ application_app_state_dir }}/config/"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"
    directory_mode: "{{ application_dir_mode }}"
  when:
    # Shipping files from the repo is what makes an app 'source'; a 'simple' app is
    # defined entirely at the call site and has no config tree to copy.
    - application_kind == 'source'
    - application_config_dir.stat.exists
    - application_config_dir.stat.isdir
  register: application_config_deploy

# Every host path this deploy just installed. For 'source': the two flat install dirs by
# basename, plus the config tree with its relative layout preserved. For 'simple': the one
# rendered Quadlet. Derived in one place so the prune below and the recorded manifest
# cannot disagree about the set.
#
# The generated Caddy route is deliberately not in here. It lives in the reverse proxy's
# config tree rather than this app's, so it is outside what the manifest allowlist admits,
# and absent.yml removes it by name instead.
- name: "Collect installed paths for app {{ application_name }}"
  ansible.builtin.set_fact:
    application_installed_paths: >-
      {{ application_simple_installed_paths if application_kind == 'simple'
         else application_source_installed_paths }}
  vars:
    application_simple_installed_paths:
      - "{{ application_system_dir }}/{{ application_name }}.container"
    application_source_installed_paths: >-
      {{ ([application_system_dir] | product(application_source_quadlet_files | map('basename') | list) | map('join', '/') | list)
         + ([application_unit_dir] | product(application_source_unit_files | map('basename') | list) | map('join', '/') | list)
         + ([application_app_state_dir ~ '/config'] | product(application_config_found.files | default([])
            | map(attribute='path') | map('relpath', application_source_config_dir) | list) | map('join', '/') | list) }}

# Files the last deploy installed that this one does not: renamed, dropped from the app's
# source tree, or belonging to the kind the app has just stopped being. Left behind they
# are still live host state — the Quadlet generator keeps making services from stale unit
# files, and stale config keeps being mounted. Pruned after the installs above, so the app
# is never left without its files.
#
# A unit whose file is pruned while it is running keeps running until it is stopped or the
# host reboots, so converting an app that shipped several units means stopping the ones it
# no longer ships by hand, once. See README.
- name: "Remove files no longer installed by app {{ application_name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ application_manifest_paths | difference(application_installed_paths) }}"
  notify: Reload systemd

# The config copy above creates this, but only for an app that ships a config tree. Every
# app owns host state below it regardless: the install manifest recorded just below, and
# for some also a bind-mounted data directory or the digests of the secrets it last stored.
- name: "Ensure state directory exists for app {{ application_name }}"
  ansible.builtin.file:
    path: "{{ application_app_state_dir }}"
    state: directory
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_dir_mode }}"

# Written last: a failure part-way through the install leaves the older, wider
# manifest in place, so the next run still knows about every file on the host.
- name: "Record install manifest for app {{ application_name }}"
  ansible.builtin.template:
    src: install-manifest.j2
    dest: "{{ application_manifest_file }}"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"

# Bind-mount targets the app itself writes to, named relative to the app's state dir.
# Podman creates a missing host path as root:root, which an unprivileged container cannot
# write in, so the directory is made here with the owner the image runs as. The deploy
# would not notice otherwise: the mount succeeds either way, and only the app hits the
# failure, later, when it tries to write.
- name: "Verify data directories are relative paths for app {{ application_name }}"
  ansible.builtin.assert:
    that:
      # Created as root with a caller-supplied owner, and removed with the state tree on
      # absent, so a path that climbed out of this app's own directory would hand another
      # app's data away — or take it with it. Relative and '..'-free is what makes that
      # impossible, rather than a prefix check on a path the caller composed.
      - item.path is string
      - not item.path.startswith('/')
      - item.path.split('/') | intersect(['', '.', '..']) | length == 0
    fail_msg: >-
      Refusing to create '{{ item.path | default('(no path)') }}': an entry of
      application_data_dirs names a path relative to {{ application_app_state_dir }} —
      'data', not '/var/app/<app>/data' — and may not climb out of it with '..'.
    quiet: true
  loop: "{{ application_data_dirs }}"
  loop_control:
    label: "{{ item.path | default('(no path)') }}"

- name: "Ensure data directories exist for app {{ application_name }}"
  ansible.builtin.file:
    path: "{{ application_app_state_dir }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(application_owner) }}"
    group: "{{ item.group | default(application_group) }}"
    mode: "{{ item.mode | default(application_dir_mode) }}"
  loop: "{{ application_data_dirs }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Stat recorded secret digests for app {{ application_name }}"
  ansible.builtin.stat:
    path: "{{ application_secret_digest_file }}"
  register: application_secret_digest_stat

- name: "Read recorded secret digests for app {{ application_name }}"
  ansible.builtin.slurp:
    src: "{{ application_secret_digest_file }}"
  register: application_secret_digest_slurp
  when: application_secret_digest_stat.stat.exists | default(false)

# Storing is create-only, so what changed has to be worked out first. Compared as
# {name, digest} pairs: a secret is stored again when its value changed and equally when
# it has never been stored — a host whose secret store was cleared, or a name new to the
# file. Recorded names the file no longer holds are dropped; a rename would otherwise
# leave the old secret on the host with nothing referencing it. Digests and names only —
# no value reaches a fact, which the deploy is verbose enough to print.
- name: "Reconcile recorded secrets of app {{ application_name }}"
  ansible.builtin.set_fact:
    application_secret_names_to_store: >-
      {{ (application_secret_digests | dict2items)
         | difference(application_secret_recorded | dict2items)
         | map(attribute='key') | list }}
    application_secret_names_to_drop: >-
      {{ application_secret_recorded.keys() | difference(application_secret_digests.keys()) | list }}
  vars:
    application_secret_recorded: >-
      {{ (application_secret_digest_slurp.content | default('') | b64decode
          | default('{}', true)) | from_json }}

# Podman cannot update a stored secret in place on every version this may run on, and
# `create` refuses a name that exists, so a rotation is a remove followed by a create.
# The same pass removes the ones dropped from the file.
- name: "Remove superseded podman secrets of app {{ application_name }}"
  ansible.builtin.command:
    argv: [podman, secret, rm, "{{ item }}"]
  loop: >-
    {{ application_secret_names_to_store | default([])
       | union(application_secret_names_to_drop | default([])) }}
  register: application_secret_rm
  changed_when: application_secret_rm.rc == 0
  failed_when:
    - application_secret_rm.rc != 0
    - "'no such secret' not in (application_secret_rm.stderr | default('') | lower)"

# The value goes in on stdin, never in argv: /proc/<pid>/cmdline is world-readable, so
# a command line carrying the secret would expose it to every user on the host for as
# long as the process lives.
- name: "Store podman secrets of app {{ application_name }}"
  ansible.builtin.command:
    argv: [podman, secret, create, "{{ item.key }}", "-"]
    stdin: "{{ item.value }}"
    stdin_add_newline: false
  loop: >-
    {{ application_secret_values | dict2items
       | selectattr('key', 'in', application_secret_names_to_store | default([])) | list }}
  loop_control:
    label: "{{ item.key }}"
  register: application_secret_create
  changed_when: true
  no_log: true

# Written after the store succeeds, so a run that fails part-way leaves the older record
# standing and the next one retries the secrets it did not get to.
- name: "Record secret digests for app {{ application_name }}"
  ansible.builtin.copy:
    content: "{{ application_secret_digests | to_nice_json }}\n"
    dest: "{{ application_secret_digest_file }}"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    # Not a secret, but a digest of one: readable only by root, like the store itself.
    mode: "0600"
  when: application_secret_values | length > 0

# An app that has stopped shipping secrets altogether: the record goes, having just been
# used to drop them.
- name: "Forget recorded secret digests of app {{ application_name }}"
  ansible.builtin.file:
    path: "{{ application_secret_digest_file }}"
    state: absent
  when: application_secret_values | length == 0

# Caddy route: only written when the app opts in with application_domain. The
# snippet is imported by the central Caddyfile, so no daemon-reload is needed and
# Caddy is reloaded once by the deploy playbook (post-task), not by this role.
- name: "Ensure Caddy conf.d directory exists for route of {{ application_name }}"
  ansible.builtin.file:
    path: "{{ application_caddy_confd }}"
    state: directory
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_dir_mode }}"
  when: application_domain is defined and (application_domain | string | length > 0)

- name: "Register Caddy route for {{ application_name }}"
  ansible.builtin.template:
    src: caddy-site.caddy.j2
    dest: "{{ application_caddy_confd }}/{{ application_name }}.caddy"
    owner: "{{ application_owner }}"
    group: "{{ application_group }}"
    mode: "{{ application_file_mode }}"
  when: application_domain is defined and (application_domain | string | length > 0)

# Regenerate Quadlet-derived services and pick up new unit files before we
# touch their state. Handlers notified above run here, not at end of play.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers

# Nothing this deploy wrote is live yet, and the two ways it becomes live differ.
#
# A new container is the only way a changed secret or unit definition takes effect: podman
# reads a secret when it *creates* the container, and the daemon-reload above only
# regenerates the service file — systemd never acts on a unit it merely re-read, so the
# container keeps running from the image and options it was created with. 'started' would
# report success on both and leave the app serving the old ones.
#
# Config is different: the file is bind-mounted, so it is already in place and only the
# process needs telling. Which is why this is not folded into the restart above — an app
# whose unit declares ExecReload= means it can take config without dropping what it is
# serving, and cycling it anyway would throw that away.
#
# Files removed by the prune are counted only when they were config. A removed unit file
# leaves nothing to act on; a removed config file is a change to what a still-running app
# reads.
- name: "Decide how this deploy reaches the running units of app {{ application_name }}"
  ansible.builtin.set_fact:
    application_restart_needed: >-
      {{ (application_secret_create.changed | default(false))
         or (application_quadlet_render.changed | default(false))
         or (application_quadlet_install.changed | default(false))
         or (application_unit_install.changed | default(false)) }}
    application_config_changed: >-
      {{ (application_config_deploy.changed | default(false))
         or (application_manifest_paths | difference(application_installed_paths)
             | select('match', application_config_path_prefix) | list | length > 0) }}
  vars:
    # Escaped, because it is built from a name and interpolated into a regex.
    application_config_path_prefix: "{{ (application_app_state_dir ~ '/config/') | regex_escape }}"

# Registered for the reload below: the module returns the unit's `systemctl show`
# properties, so no separate probe is needed to learn whether it can reload.
- name: "Start units for app {{ application_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'restarted' if application_restart_needed | bool else 'started' }}"
  loop: "{{ application_managed_units }}"
  register: application_start_result

# Skipped when the app was restarted just above, which already picked the config up. An
# app whose unit has no ExecReload= reports CanReload=no and is restarted instead — the
# blunt path, but the only one that gets the change into the process.
- name: "Apply changed config to units of app {{ application_name }}"
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: "{{ 'reloaded' if (item.status.CanReload | default('no')) == 'yes' else 'restarted' }}"
  loop: "{{ application_start_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - application_config_changed | bool
    - not application_restart_needed | bool

# Quadlet-generated services live in /run and are "transient or generated",
# so `systemctl enable` on them fails — boot persistence comes from their
# [Install] section instead. Tolerate exactly that case; fail on anything else.
- name: "Enable boot-start of units for app {{ application_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop: "{{ application_managed_units }}"
  register: application_enable_result
  failed_when:
    - application_enable_result is failed
    - "'transient or generated' not in (application_enable_result.msg | default(''))"
    - "'no installation config' not in (application_enable_result.msg | default('') | lower)"
