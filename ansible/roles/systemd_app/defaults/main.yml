---
# systemd_app_kind selects the deployment model and is REQUIRED at every call
# site (deliberately no default, so the mode is always explicit):
#   source -> install an app's files from a controller directory (see below).
#   inline -> render a single-container Quadlet from call-site params (image, env,
#             volumes, ...) with no source directory. See README.

# Lifecycle: 'present' deploys the app and starts its units, dropping any file a
# previous deploy installed and this one does not; 'absent' stops those units and
# removes everything the app owns on the host, config and data included (then delete
# the role call). Destructive — back the app up first. See README.
systemd_app_state: present

# App definitions on the Ansible controller.
# Layout:  {{ systemd_app_apps_dir }}/<systemd_app_name>/
#   quadlet/            -> Podman Quadlet files (*.container, *.pod, *.network, ...)
#   unit/               -> plain systemd unit files (*.service, *.timer, *.socket, ...)
#   config/             -> arbitrary config tree, copied recursively to the host
#   secrets.sops.yaml   -> SOPS-encrypted podman secrets (see below)
# The first three belong to the 'source' kind; the secrets file is read for either kind, so
# an 'inline' app with secrets has a directory holding just that.
#
# Deliberately no default: where a fleet keeps its app definitions is a property of that
# fleet's repository, not of this role, and a guess here is one that silently installs
# nothing (see the source-directory check in tasks/main.yml). Set it once as a play
# variable — every app in a play shares it. A 'source' app requires it; an 'inline' app
# needs it only to be found by the secrets lookup, which is skipped without it.
# systemd_app_apps_dir: /path/to/apps

# Destinations on the target host.
systemd_app_system_dir: /etc/containers/systemd   # Quadlet files (read by the generator)
systemd_app_unit_dir: /etc/systemd/system         # plain systemd units
systemd_app_root: /var/app                        # each app's home: {{ root }}/{app}

# Everything this app owns on the host below systemd_app_root: its deployed
# config tree, plus any data a Quadlet bind-mounts under the same directory. Removed
# wholesale on absent, so back the app up before decommissioning it.
systemd_app_home: "{{ systemd_app_root }}/{{ systemd_app_name }}"

# Where an app records the host paths it installed — a 'source' app's Quadlet files,
# systemd units and config tree, an 'inline' app's one rendered Quadlet. Both a later
# deploy (to drop files it no longer installs) and decommission read this manifest
# instead of re-deriving from the controller's apps/<name>/ tree, which by then may name
# different files or be gone. Recorded for both kinds so that converting an app from one
# to the other reconciles: what the old kind installed is what the new kind prunes.
#
# It lives inside the app's own home so the two share fate: the absent path drops
# that whole tree, which takes the manifest with it, and a hand-removed or restored
# /var/app/<app> cannot leave a stale record behind. Root-owned; every recorded path is
# allowlisted before anything is removed.
systemd_app_manifest_file: "{{ systemd_app_home }}/.install-manifest"

# The controller-side sources a 'source' deploy installs from. quadlet/ and unit/ are
# flat — installed by basename — while config/ is a tree whose layout is preserved, so
# present.yml discovers it with `find` rather than a one-level fileglob.
systemd_app_source_quadlet_files: "{{ query('ansible.builtin.fileglob', systemd_app_apps_dir ~ '/' ~ systemd_app_name ~ '/quadlet/*') }}"
systemd_app_source_unit_files: "{{ query('ansible.builtin.fileglob', systemd_app_apps_dir ~ '/' ~ systemd_app_name ~ '/unit/*') }}"
systemd_app_source_config_dir: "{{ systemd_app_apps_dir }}/{{ systemd_app_name }}/config"

# Ownership / permissions applied to everything this role installs.
systemd_app_owner: root
systemd_app_group: root
systemd_app_file_mode: "0644"
systemd_app_dir_mode: "0755"

# Caddy auto-routing: when systemd_app_domain is set, a per-app route snippet
# lands here and is imported by the Caddyfile (`import /etc/caddy/conf.d/*.caddy`),
# so a routed app needs no edit to the central Caddyfile. Caddy is reloaded once
# by the deploy playbook (post-task), not here.
#
# Composed from systemd_app_root rather than written out, so the routes follow the app
# directories when that root moves. It is still the reverse proxy's own config tree —
# the one directory this role writes into that belongs to another app — so an app named
# something other than 'reverse_proxy' overrides this.
systemd_app_caddy_confd: "{{ systemd_app_root }}/reverse_proxy/config/conf.d"

# Route target when systemd_app_domain is set. The upstream defaults to the app
# name (the common case where ContainerName matches, including every 'inline'
# app), but an app whose routable container is named differently overrides
# systemd_app_upstream.
systemd_app_port: 8080                       # internal upstream port for the Caddy route
systemd_app_upstream: "{{ systemd_app_name }}"   # upstream host (container name on the shared network)

# 'inline'-kind defaults for the rendered single container. Override at the call
# site as needed; ignored by 'source'-kind apps (they declare these in their own
# Quadlet files).
systemd_app_network: web.network             # shared network the container joins
systemd_app_env: {}                          # rendered as Environment= lines
systemd_app_volumes: []                      # raw Volume= values
systemd_app_publish_ports: []                # raw PublishPort= values
systemd_app_container_options: []            # extra raw [Container] lines
systemd_app_service_options: []              # extra raw [Service] lines

# An app that needs secrets ships one SOPS-encrypted file in its own directory, keyed by
# the podman secret names its Quadlet references with Secret=:
#   whichday-oidc-client-secret: ENC[AES256_GCM,...]
# Discovered, not declared — like the app's quadlet/ and config/ directories — so the
# encrypted file is the single place the set is written down. It sits at the app root,
# outside the three directories this role installs from, so nothing copies it to the host.
# Nothing sensitive is stored in a file this role installs either: a unit file is
# world-readable by design, which is what makes Environment= the wrong home for a secret.
# Names are host-global, so prefix them with the app name to keep two apps apart. An
# 'inline' app gets its Secret= lines rendered from these names, the variable being the
# name upper-cased with dashes as underscores; a 'source' app writes the line itself and
# can point it at any variable. See ansible/SECRETS.md.
systemd_app_secrets_file: "{{ systemd_app_apps_dir }}/{{ systemd_app_name }}/secrets.sops.yaml"

# The decrypted file, as one dict rather than top-level vars: its keys are podman secret
# names, which are not legal variable names, and nothing sensitive then becomes a play
# variable. Populated by present.yml when the file exists.
systemd_app_secret_values: {}

# SHA-256 of every secret this app last stored, keyed by secret name. Podman offers no
# version-independent way to read a stored secret back, so a digest recorded here is what
# tells the next run which values actually changed — without it, every converge would have
# to recreate the secrets and restart the app to be sure. Its key set doubles as the record
# of which secrets the app owns: that is how a later deploy drops one the app has stopped
# declaring, and how a decommission knows what to remove without the encrypted file.
# Root-only, and it lives in the app's home so a decommission takes it along.
#
# What it records is what was stored, not what is stored: nothing stops a secret being
# removed from the host by hand. So a deploy reads the store as well and re-stores any name
# recorded here that podman no longer holds, rather than trusting the record and leaving the
# app pointing at a name that is gone.
systemd_app_secret_digest_file: "{{ systemd_app_home }}/.secret-digests"
systemd_app_secret_digests: "{{ systemd_app_secret_values | secret_digests }}"

# Directories to create before the container starts, for a bind mount whose contents the
# app writes itself: podman would otherwise create the host path as root and a container
# running unprivileged could not write in it. Each entry is {path, owner, group, mode},
# where path is relative to this app's own home — so it cannot name another app's:
#   - path: data            # -> {{ systemd_app_home }}/data
#     owner: "10001"        # the image's non-root user, by numeric id
systemd_app_data_dirs: []

# Healthcheck policy for an 'inline' app. The probe itself cannot have a useful default
# — an HTTP app wants a request, Postgres wants pg_isready — so it comes from the call
# site, and the rest of the block is fleet policy set once here. Naming a command turns
# on Notify=healthy, which is what makes a bad image a failed start that
# `podman auto-update` rolls back instead of a container that is up and serving nothing.
# Leave systemd_app_health_cmd empty for an app that cannot be probed.
systemd_app_health_cmd: ""                   # e.g. pg_isready -q -U postgres
systemd_app_health_interval: 15s
systemd_app_health_retries: 3
systemd_app_health_start_period: 60s
# Deadline for the first passing probe: Notify=healthy makes systemd's 90s default a
# hard limit, which is tight for a cold start and would roll back a good image.
systemd_app_start_timeout: 180

# Units this role starts/enables (present) and stops (absent). An 'inline' app
# renders exactly one <name>.service, so default to that when the caller names
# none; a 'source' app starts nothing unless it lists units (boot comes from the
# Quadlet [Install] section, e.g. the network-only 'shared' app has no service).
systemd_app_managed_units: >-
  {{ (systemd_app_enable_units | default([]))
     if (systemd_app_enable_units | default([]) | length > 0)
     else ([systemd_app_name ~ '.service'] if systemd_app_kind == 'inline' else []) }}

# --- Per-invocation parameters (passed as role params, see README) -------
# systemd_app_kind:         REQUIRED — 'source' (files from a dir) or 'inline' (rendered container).
# systemd_app_name:         REQUIRED — app dir name (source) / container name + Quadlet basename (inline).
# systemd_app_state:        optional — present (default) deploys; absent decommissions.
# systemd_app_enable_units: optional — systemd unit names to enable at boot and start now.
# systemd_app_domain:       optional — public hostname; when set, a Caddy route is added.
# systemd_app_upstream:     optional — upstream container name (default systemd_app_name).
# systemd_app_port:         optional — upstream port (default 8080).
# --- 'inline'-kind only ---
# systemd_app_image:        REQUIRED for inline+present — full image ref, e.g. docker.io/org/app:latest.
# systemd_app_description:  optional — unit description (default "<name> container").
# systemd_app_network/env/volumes/publish_ports: optional — see defaults above.
# systemd_app_container_options/service_options: optional — raw lines for the
#   [Container] / [Service] sections, for keys this role has no parameter of its own.
# systemd_app_data_dirs:    optional — bind-mount directories to pre-create with a given owner.
# systemd_app_health_cmd:   optional — probe command; set it to get a healthcheck and
#   the auto-update rollback that depends on it. See the health defaults above.
