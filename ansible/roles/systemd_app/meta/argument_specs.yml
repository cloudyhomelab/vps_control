---
argument_specs:
  main:
    short_description: Deploy or decommission one app — files from a directory (source) or a rendered single container (inline) — plus its route.
    options:
      systemd_app_kind:
        type: str
        required: true
        choices: [source, inline]
        description: >-
          source installs an app's Quadlet files, systemd units, and config tree
          from a controller directory; inline renders a single-container Quadlet
          from call-site params (systemd_app_image, systemd_app_env, ...). Required.
      systemd_app_state:
        type: str
        required: false
        default: present
        choices: [present, absent]
        description: >-
          present deploys the app and starts its units, removing files a previous
          deploy installed and this one does not; absent stops those units and removes
          everything the app owns on the host — Quadlet files, systemd units, Caddy
          route, and its config/data directory (then delete the role call). absent is
          destructive and not reversible; back the app up first.
      systemd_app_name:
        type: str
        required: true
        description: >-
          source: app directory name under systemd_app_apps_dir. inline: container
          name, Quadlet basename, and network DNS name the reverse proxy resolves.
      systemd_app_enable_units:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          systemd unit names to enable at boot and start now. An inline app defaults
          to its single <name>.service when none are given.
      systemd_app_image:
        type: str
        required: false
        description: >-
          inline kind only. Full image reference, e.g. docker.io/org/app:latest.
          Required when systemd_app_kind is inline and state is present (enforced
          in the role); not needed for source apps or for absent.
      systemd_app_description:
        type: str
        required: false
        description: >-
          inline kind only. Unit description (default "<name> container"). May not contain
          a control character, which would end the line and turn the rest into a further
          unit directive.
      systemd_app_network:
        type: str
        required: false
        default: web.network
        description: inline kind only. Podman network the rendered container joins.
      systemd_app_env:
        type: dict
        required: false
        default: {}
        description: >-
          inline kind only. Environment variables rendered as Environment= lines. Keys
          must spell legal variable names (letters, digits, underscore; no leading digit).
          Values are quoted and escaped for you, so spaces, quotes and '%' are fine; a
          control character is refused, having no representation in a unit file. Not for
          secrets — a unit file is world-readable; see the secrets section of the README.
      systemd_app_volumes:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          inline kind only. Raw Quadlet Volume= values, one line per entry — an entry
          holding a newline is refused rather than injected into the unit.
      systemd_app_publish_ports:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          inline kind only. Raw Quadlet PublishPort= values for apps that need a host
          port, one line per entry.
      systemd_app_container_options:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          inline kind only. Raw lines appended to the [Container] section, for Quadlet
          keys this role has no parameter of its own (e.g. HealthCmd=, Notify=). One line
          per entry; an entry holding a newline is refused.
      systemd_app_service_options:
        type: list
        elements: str
        required: false
        default: []
        description: >-
          inline kind only. Raw lines appended to the [Service] section, for unit keys
          this role has no parameter of its own. One line per entry; an entry holding a
          newline is refused.
      systemd_app_data_dirs:
        type: list
        elements: dict
        required: false
        default: []
        description: >-
          Directories to create before the container starts, for bind mounts the app
          writes to itself — podman would create the host path as root:root, which an
          unprivileged container cannot write in. Paths are relative to the app's own state
          dir, and are removed with it on absent.
        options:
          path:
            type: str
            required: true
            description: >-
              Path relative to the app's home (systemd_app_root/<app>), e.g.
              'data'. Absolute paths and '..' are refused.
          owner:
            type: str
            required: false
            description: Owner, normally the numeric uid the image runs as (default root).
          group:
            type: str
            required: false
            description: Group, normally the numeric gid the image runs as (default root).
          mode:
            type: str
            required: false
            description: Permissions (default systemd_app_dir_mode).
      systemd_app_health_cmd:
        type: str
        required: false
        default: ''
        description: >-
          inline kind only. Healthcheck command run inside the container — an HTTP
          request, pg_isready, whatever fits the app. Setting it emits the whole health
          block plus Notify=healthy, so a bad image fails to start and podman
          auto-update rolls it back. Empty means no healthcheck.
      systemd_app_health_interval:
        type: str
        required: false
        default: 15s
        description: inline kind only. Time between probes once the container is up.
      systemd_app_health_retries:
        type: int
        required: false
        default: 3
        description: inline kind only. Consecutive failures before the container is unhealthy.
      systemd_app_health_start_period:
        type: str
        required: false
        default: 60s
        description: >-
          inline kind only. Grace window after start during which a failing probe does
          not count against the retries.
      systemd_app_start_timeout:
        type: int
        required: false
        default: 180
        description: >-
          inline kind only. TimeoutStartSec for the unit, applied when a health command
          is set — Notify=healthy turns it into the deadline for the first passing probe.
      systemd_app_domain:
        type: str
        required: false
        description: >-
          Public hostname. When set, a Caddy route (domain -> upstream:port) is
          written to the imported conf.d directory. Must be a hostname of at least
          two labels, optionally wildcarded ('*.example.com'): it becomes the address
          of a Caddy site block, and the Caddyfile imports every app's, so a value
          that breaks this one stops Caddy loading any route.
      systemd_app_upstream:
        type: str
        required: false
        description: >-
          Upstream container name the route proxies to, as resolved on the shared
          network. Defaults to systemd_app_name; override when the routable
          container is named differently. A container name, so the same shape as
          systemd_app_name.
      systemd_app_port:
        type: int
        required: false
        default: 8080
        description: Internal upstream port for the Caddy route. 1-65535.
      # Host layout and controller layout. Set once for a fleet rather than per app,
      # but specced because a consumer whose hosts are laid out differently sets them.
      systemd_app_apps_dir:
        type: str
        required: false
        description: >-
          Directory on the controller holding the app definitions, one directory per
          app name — where a source app's quadlet/, unit/ and config/ are read from,
          and where either kind's secrets.sops.yaml is looked for. No default.
          Required when systemd_app_kind is source (enforced in the role, the spec
          having no way to require an option only for a given value of another); an
          inline app without it simply ships no secrets.
      systemd_app_system_dir:
        type: str
        required: false
        default: /etc/containers/systemd
        description: >-
          Host directory Quadlet files are installed to — the one the Quadlet
          generator reads at daemon-reload, so it is a podman-defined path rather
          than a free choice.
      systemd_app_unit_dir:
        type: str
        required: false
        default: /etc/systemd/system
        description: >-
          Host directory plain systemd units from a source app's unit/ are
          installed to.
      systemd_app_root:
        type: str
        required: false
        default: /var/app
        description: >-
          Parent of every app's home on the host; this app's is <root>/<name>, holding
          its deployed config tree, its bind-mounted data and its install manifest, and
          removed wholesale on absent.
      systemd_app_caddy_confd:
        type: str
        required: false
        description: >-
          Host directory the generated Caddy route snippet is written to, which the
          reverse proxy's Caddyfile imports. The one directory this role writes into
          that another app owns, so it follows wherever that app keeps its config.
