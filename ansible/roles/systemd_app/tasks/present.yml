---
# Secrets: an app that needs any ships apps/<app>/secrets.sops.yaml, keyed by the podman
# secret names. Found rather than declared, like the app's quadlet/ and config/
# directories, so that file is the only place the set is written down. First in the file
# because a 'simple' app's Quadlet is rendered from those names below.
- name: "Check for encrypted secrets of app {{ systemd_app_name }}"
  ansible.builtin.stat:
    path: "{{ systemd_app_secrets_file }}"
  delegate_to: localhost
  become: false
  register: systemd_app_secrets_stat

# Decrypted on the controller; the values reach the host only through the secret store
# below. no_log because the result carries them and the deploy runs with -v, which prints
# task results.
- name: "Load encrypted secrets of app {{ systemd_app_name }}"
  community.sops.load_vars:
    file: "{{ systemd_app_secrets_file }}"
    name: systemd_app_secret_values
    # Pinned rather than left on 'auto', so what this returns does not change with the
    # controller's ansible-core version.
    return_method: facts-only
  register: systemd_app_secret_load
  no_log: true
  when: systemd_app_secrets_stat.stat.exists

# Taken from the register rather than used where the task above put it: main.yml clears
# the per-app facts with set_fact, whose precedence beats a fact returned by a later task,
# so that empty default would shadow the loaded values for the whole run. Assigning here
# also means this runs for every app, and one app's secrets can never carry into the
# next — an app with no encrypted file lands back on the empty default.
- name: "Collect the decrypted secrets of app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_secret_values: >-
      {{ systemd_app_secret_load.ansible_facts.systemd_app_secret_values | default({}, true) }}
  no_log: true

- name: "Verify every secret can be stored for app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      # Passed to `podman secret` as root, and useful only if a Quadlet can reference it.
      - item.key is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
      # A 'simple' app's Secret= line is rendered from this key, so the key also has to
      # spell a legal environment variable once upper-cased — no dots, no leading digit.
      - systemd_app_kind != 'simple' or item.key is match('^[A-Za-z][A-Za-z0-9-]*$')
      # Refused here rather than at container start, where an empty value surfaces as the
      # app failing to boot with no explanation of why.
      - item.value is not none and (item.value | string | length > 0)
    fail_msg: >-
      {{ systemd_app_name }}/secrets.sops.yaml must map podman secret names (letters,
      digits, dot, dash or underscore, not starting with a dot) to non-empty values. For a
      'simple' app the name is also the variable the container sees, upper-cased with
      dashes as underscores, so it is limited to letters, digits and dashes.
    quiet: true
  loop: "{{ systemd_app_secret_values | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  no_log: true

# 'simple' kind: render the single-container Quadlet from inline params. 'source'
# kind installs its container from a file instead (the copy tasks below).
- name: "Render Quadlet for container {{ systemd_app_name }}"
  ansible.builtin.template:
    src: simple.container.j2
    dest: "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_kind == 'simple'
  register: systemd_app_quadlet_render
  notify: Reload systemd

# What the last deploy installed, so the files below can be reconciled against it. Read
# for either kind, and that is what makes a change of kind converge: the paths recorded
# by a 'source' deploy are exactly what the 'simple' one it became has to prune, and the
# other way round.
- name: "Read recorded install manifest for app {{ systemd_app_name }}"
  ansible.builtin.include_tasks: read-manifest.yml

- name: "Install Quadlet files for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ systemd_app_system_dir }}/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  loop: "{{ systemd_app_source_quadlet_files }}"
  when: systemd_app_kind == 'source'
  register: systemd_app_quadlet_install
  notify: Reload systemd

- name: "Install systemd units for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ systemd_app_unit_dir }}/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  loop: "{{ systemd_app_source_unit_files }}"
  when: systemd_app_kind == 'source'
  register: systemd_app_unit_install
  notify: Reload systemd

- name: "Check for config directory of app {{ systemd_app_name }}"
  ansible.builtin.stat:
    path: "{{ systemd_app_source_config_dir }}"
  delegate_to: localhost
  become: false
  register: systemd_app_config_dir

# Recursive, because a config tree nests and fileglob sees only one level down. The
# manifest has to list every file the copy below installs, or the next deploy prunes
# something it should have kept.
- name: "Find config files of app {{ systemd_app_name }}"
  ansible.builtin.find:
    paths: "{{ systemd_app_source_config_dir }}"
    recurse: true
    hidden: true
    file_type: file
  delegate_to: localhost
  become: false
  register: systemd_app_config_found
  when:
    - systemd_app_kind == 'source'
    - systemd_app_config_dir.stat.exists
    - systemd_app_config_dir.stat.isdir

- name: "Deploy config tree for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    src: "{{ systemd_app_source_config_dir }}/"
    dest: "{{ systemd_app_home }}/config/"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
    directory_mode: "{{ systemd_app_dir_mode }}"
  when:
    # Shipping files from the repo is what makes an app 'source'; a 'simple' app is
    # defined entirely at the call site and has no config tree to copy.
    - systemd_app_kind == 'source'
    - systemd_app_config_dir.stat.exists
    - systemd_app_config_dir.stat.isdir
  register: systemd_app_config_deploy

# Every host path this deploy just installed. For 'source': the two flat install dirs by
# basename, plus the config tree with its relative layout preserved. For 'simple': the one
# rendered Quadlet. Derived in one place so the prune below and the recorded manifest
# cannot disagree about the set.
#
# The generated Caddy route is deliberately not in here. It lives in the reverse proxy's
# config tree rather than this app's, so it is outside what the manifest allowlist admits,
# and absent.yml removes it by name instead.
- name: "Collect installed paths for app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_installed_paths: >-
      {{ systemd_app_simple_installed_paths if systemd_app_kind == 'simple'
         else systemd_app_source_installed_paths }}
  vars:
    systemd_app_simple_installed_paths:
      - "{{ systemd_app_system_dir }}/{{ systemd_app_name }}.container"
    systemd_app_source_installed_paths: >-
      {{ ([systemd_app_system_dir] | product(systemd_app_source_quadlet_files | map('basename') | list) | map('join', '/') | list)
         + ([systemd_app_unit_dir] | product(systemd_app_source_unit_files | map('basename') | list) | map('join', '/') | list)
         + ([systemd_app_home ~ '/config'] | product(systemd_app_config_found.files | default([])
            | map(attribute='path') | map('relpath', systemd_app_source_config_dir) | list) | map('join', '/') | list) }}

# Files the last deploy installed that this one does not: renamed, dropped from the app's
# source tree, or belonging to the kind the app has just stopped being. Left behind they
# are still live host state — the Quadlet generator keeps making services from stale unit
# files, and stale config keeps being mounted. Pruned after the installs above, so the app
# is never left without its files.
#
# A unit whose file is pruned while it is running keeps running until it is stopped or the
# host reboots, so converting an app that shipped several units means stopping the ones it
# no longer ships by hand, once. See README.
- name: "Remove files no longer installed by app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ systemd_app_manifest_paths | difference(systemd_app_installed_paths) }}"
  notify: Reload systemd

# The config copy above creates this, but only for an app that ships a config tree. Every
# app owns host state below it regardless: the install manifest recorded just below, and
# for some also a bind-mounted data directory or the digests of the secrets it last stored.
- name: "Ensure the home directory exists for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"

# Written last: a failure part-way through the install leaves the older, wider
# manifest in place, so the next run still knows about every file on the host.
- name: "Record install manifest for app {{ systemd_app_name }}"
  ansible.builtin.template:
    src: install-manifest.j2
    dest: "{{ systemd_app_manifest_file }}"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"

# Bind-mount targets the app itself writes to, named relative to the app's home.
# Podman creates a missing host path as root:root, which an unprivileged container cannot
# write in, so the directory is made here with the owner the image runs as. The deploy
# would not notice otherwise: the mount succeeds either way, and only the app hits the
# failure, later, when it tries to write.
- name: "Verify data directories are relative paths for app {{ systemd_app_name }}"
  ansible.builtin.assert:
    that:
      # Created as root with a caller-supplied owner, and removed with the state tree on
      # absent, so a path that climbed out of this app's own directory would hand another
      # app's data away — or take it with it. Relative and '..'-free is what makes that
      # impossible, rather than a prefix check on a path the caller composed.
      - item.path is string
      - not item.path.startswith('/')
      - item.path.split('/') | intersect(['', '.', '..']) | length == 0
    fail_msg: >-
      Refusing to create '{{ item.path | default('(no path)') }}': an entry of
      systemd_app_data_dirs names a path relative to {{ systemd_app_home }} —
      'data', not '/var/app/<app>/data' — and may not climb out of it with '..'.
    quiet: true
  loop: "{{ systemd_app_data_dirs }}"
  loop_control:
    label: "{{ item.path | default('(no path)') }}"

- name: "Ensure data directories exist for app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_home }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(systemd_app_owner) }}"
    group: "{{ item.group | default(systemd_app_group) }}"
    mode: "{{ item.mode | default(systemd_app_dir_mode) }}"
  loop: "{{ systemd_app_data_dirs }}"
  loop_control:
    label: "{{ item.path }}"

- name: "Stat recorded secret digests for app {{ systemd_app_name }}"
  ansible.builtin.stat:
    path: "{{ systemd_app_secret_digest_file }}"
  register: systemd_app_secret_digest_stat

- name: "Read recorded secret digests for app {{ systemd_app_name }}"
  ansible.builtin.slurp:
    src: "{{ systemd_app_secret_digest_file }}"
  register: systemd_app_secret_digest_slurp
  when: systemd_app_secret_digest_stat.stat.exists | default(false)

# What the store actually holds right now. The digest record says what this app last
# stored, not what podman still has: a secret removed by hand, or lost with a store reset,
# leaves the record matching so nothing would re-store it — and the app then references a
# name podman no longer knows, which surfaces as a container that will not start with no
# hint that a deploy could have fixed it. Only asked of a host for an app that has secrets.
#
# The Go template is escaped into the argument rather than written literally, so Jinja
# leaves it for podman; `.Name` is a documented field of `podman secret ls`, unlike the
# shape of its JSON, which has differed between versions.
- name: "List stored podman secrets for app {{ systemd_app_name }}"
  ansible.builtin.command:
    argv: [podman, secret, ls, --format, "{{ '{{' }}.Name{{ '}}' }}"]
  register: systemd_app_secret_store_list
  changed_when: false
  when: systemd_app_secret_values | length > 0

# Storing is create-only, so what changed has to be worked out first — from three inputs:
# what this app declares, what it last stored, and what the host still holds. The rules are
# reconcile_secrets', with the cases spelled out in tests/test_systemd_app_filters.py.
# Digests and names only reach the fact; no value does, and the deploy is verbose enough to
# print what it sets.
- name: "Reconcile recorded secrets of app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_secret_reconciled: >-
      {{ systemd_app_secret_digests
         | reconcile_secrets(systemd_app_secret_digest_slurp.content | default(''),
                             systemd_app_secret_store_list.stdout_lines | default([], true)) }}

# Podman cannot update a stored secret in place on every version this may run on, and
# `create` refuses a name that exists, so a rotation is a remove followed by a create.
# The same pass removes the ones dropped from the file.
- name: "Remove superseded podman secrets of app {{ systemd_app_name }}"
  ansible.builtin.command:
    argv: [podman, secret, rm, "{{ item }}"]
  loop: "{{ systemd_app_secret_reconciled.remove | default([]) }}"
  register: systemd_app_secret_rm
  changed_when: systemd_app_secret_rm.rc == 0
  failed_when:
    - systemd_app_secret_rm.rc != 0
    - "'no such secret' not in (systemd_app_secret_rm.stderr | default('') | lower)"

# The value goes in on stdin, never in argv: /proc/<pid>/cmdline is world-readable, so
# a command line carrying the secret would expose it to every user on the host for as
# long as the process lives.
- name: "Store podman secrets of app {{ systemd_app_name }}"
  ansible.builtin.command:
    argv: [podman, secret, create, "{{ item.key }}", "-"]
    stdin: "{{ item.value }}"
    stdin_add_newline: false
  loop: >-
    {{ systemd_app_secret_values | dict2items
       | selectattr('key', 'in', systemd_app_secret_reconciled.store | default([])) | list }}
  loop_control:
    label: "{{ item.key }}"
  register: systemd_app_secret_create
  changed_when: true
  no_log: true

# Written after the store succeeds, so a run that fails part-way leaves the older record
# standing and the next one retries the secrets it did not get to.
- name: "Record secret digests for app {{ systemd_app_name }}"
  ansible.builtin.copy:
    content: "{{ systemd_app_secret_digests | to_nice_json }}\n"
    dest: "{{ systemd_app_secret_digest_file }}"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    # Not a secret, but a digest of one: readable only by root, like the store itself.
    mode: "0600"
  when: systemd_app_secret_values | length > 0

# An app that has stopped shipping secrets altogether: the record goes, having just been
# used to drop them.
- name: "Forget recorded secret digests of app {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_secret_digest_file }}"
    state: absent
  when: systemd_app_secret_values | length == 0

# Caddy route: only written when the app opts in with systemd_app_domain. The
# snippet is imported by the central Caddyfile, so no daemon-reload is needed and
# Caddy is reloaded once by the deploy playbook (post-task), not by this role.
- name: "Ensure Caddy conf.d directory exists for route of {{ systemd_app_name }}"
  ansible.builtin.file:
    path: "{{ systemd_app_caddy_confd }}"
    state: directory
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_dir_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

- name: "Register Caddy route for {{ systemd_app_name }}"
  ansible.builtin.template:
    src: caddy-site.caddy.j2
    dest: "{{ systemd_app_caddy_confd }}/{{ systemd_app_name }}.caddy"
    owner: "{{ systemd_app_owner }}"
    group: "{{ systemd_app_group }}"
    mode: "{{ systemd_app_file_mode }}"
  when: systemd_app_domain is defined and (systemd_app_domain | string | length > 0)

# Regenerate Quadlet-derived services and pick up new unit files before we
# touch their state. Handlers notified above run here, not at end of play.
- name: Apply unit changes (systemd daemon-reload)
  ansible.builtin.meta: flush_handlers

# Nothing this deploy wrote is live yet, and the two ways it becomes live differ.
#
# A new container is the only way a changed secret or unit definition takes effect: podman
# reads a secret when it *creates* the container, and the daemon-reload above only
# regenerates the service file — systemd never acts on a unit it merely re-read, so the
# container keeps running from the image and options it was created with. 'started' would
# report success on both and leave the app serving the old ones.
#
# Config is different: the file is bind-mounted, so it is already in place and only the
# process needs telling. Which is why this is not folded into the restart above — an app
# whose unit declares ExecReload= means it can take config without dropping what it is
# serving, and cycling it anyway would throw that away.
#
# Files removed by the prune are counted only when they were config. A removed unit file
# leaves nothing to act on; a removed config file is a change to what a still-running app
# reads.
- name: "Decide how this deploy reaches the running units of app {{ systemd_app_name }}"
  ansible.builtin.set_fact:
    systemd_app_restart_needed: >-
      {{ (systemd_app_secret_create.changed | default(false))
         or (systemd_app_quadlet_render.changed | default(false))
         or (systemd_app_quadlet_install.changed | default(false))
         or (systemd_app_unit_install.changed | default(false)) }}
    systemd_app_config_changed: >-
      {{ (systemd_app_config_deploy.changed | default(false))
         or (systemd_app_manifest_paths | difference(systemd_app_installed_paths)
             | select('match', systemd_app_config_path_prefix) | list | length > 0) }}
  vars:
    # Escaped, because it is built from a name and interpolated into a regex.
    systemd_app_config_path_prefix: "{{ (systemd_app_home ~ '/config/') | regex_escape }}"

# Registered for the reload below: the module returns the unit's `systemctl show`
# properties, so no separate probe is needed to learn whether it can reload.
- name: "Start units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: "{{ 'restarted' if systemd_app_restart_needed | bool else 'started' }}"
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_start_result

# Skipped when the app was restarted just above, which already picked the config up. An
# app whose unit has no ExecReload= reports CanReload=no and is restarted instead — the
# blunt path, but the only one that gets the change into the process.
- name: "Apply changed config to units of app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item.item }}"
    state: "{{ 'reloaded' if (item.status.CanReload | default('no')) == 'yes' else 'restarted' }}"
  loop: "{{ systemd_app_start_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - systemd_app_config_changed | bool
    - not systemd_app_restart_needed | bool

# Quadlet-generated services live in /run and are "transient or generated",
# so `systemctl enable` on them fails — boot persistence comes from their
# [Install] section instead. Tolerate exactly that case; fail on anything else.
- name: "Enable boot-start of units for app {{ systemd_app_name }}"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
  loop: "{{ systemd_app_managed_units }}"
  register: systemd_app_enable_result
  failed_when:
    - systemd_app_enable_result is failed
    - "'transient or generated' not in (systemd_app_enable_result.msg | default(''))"
    - "'no installation config' not in (systemd_app_enable_result.msg | default('') | lower)"
