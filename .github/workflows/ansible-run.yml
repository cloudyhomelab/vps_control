name: Run Ansible Playbook

# Generic, reusable workflow: runs any playbook under ansible/ against the VPS.
# Call it from another workflow:
#
#   jobs:
#     deploy:
#       uses: ./.github/workflows/ansible-run.yml
#       with:
#         playbook: playbooks/deploy_apps.yml
#       secrets: inherit

on:
  workflow_call:
    inputs:
      playbook:
        description: 'Playbook path, relative to the ansible/ directory'
        required: true
        type: string
      extra_vars:
        description: 'Optional extra vars passed to ansible-playbook via -e'
        required: false
        type: string
        default: ''
    secrets:
      VPS_SSH_KEY:
        required: true
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_KNOWN_HOSTS:
        required: true
      SOPS_AGE_KEY:
        required: false

# Deliberately no concurrency group of its own. A reusable workflow that names the same
# group as the caller waiting on it deadlocks, and serializing host access is the caller's
# job — every caller of this must set the shared vps-converge group.
#
# Least privilege: this workflow only reads the repo and deploys over SSH.
permissions:
  contents: read

jobs:
  run-playbook:
    name: Run ${{ inputs.playbook }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing installs Ansible: the runner image ships ansible-core with the full
      # community collection bundle in one pipx venv, and ansible-core scans sys.path for
      # collections, so community.sops resolves out of that venv with nothing downloaded.
      #
      # This step stays as the seam. It makes no network call while the image satisfies
      # requirements.yml; it installs into ~/.ansible/collections — which takes precedence
      # over the bundle — should an image ever ship below the floor declared there; and if
      # a future image drops Ansible altogether it fails here, before the first SSH,
      # instead of part-way through a converge.
      - name: Install any Ansible collection the runner image lacks
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install sops
        env:
          SOPS_VERSION: v3.13.3
          SOPS_SHA256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        run: |
          set -eu
          curl -sSfLo /tmp/sops \
            "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          printf '%s  /tmp/sops\n' "${SOPS_SHA256}" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops

      - name: Write SSH private key to file
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Pin VPS host key in known_hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PLAYBOOK: ${{ inputs.playbook }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -eu
          ARGS="-i ${VPS_HOST}, -u ${VPS_USER} --private-key ${HOME}/.ssh/vps_key"
          if [ -n "${EXTRA_VARS}" ]; then
            ansible-playbook ${ARGS} -e "${EXTRA_VARS}" "${PLAYBOOK}" -v
          else
            ansible-playbook ${ARGS} "${PLAYBOOK}" -v
          fi

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
