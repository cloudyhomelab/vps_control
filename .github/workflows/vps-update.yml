name: VPS Package Update

on:
  schedule:
    # Every Sunday at 02:00 UTC. Reboots inside that window when the update needs one,
    # so a kernel does not sit unapplied on an internet-facing host.
    - cron: '0 2 * * 0'
  workflow_dispatch:  # Manual run — same behaviour as the schedule

permissions:
  contents: read

jobs:
  update-packages:
    name: Run Ansible Package Update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Ansible
        run: |
          pip install --upgrade pip
          pip install ansible

      - name: Write SSH private key to file
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

      - name: Pin VPS host key in known_hosts
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run Ansible playbook
        working-directory: ansible
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ansible-playbook \
            -i "${VPS_HOST}," \
            -u "${VPS_USER}" \
            --private-key ~/.ssh/vps_key \
            playbooks/update_packages.yml -v

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
