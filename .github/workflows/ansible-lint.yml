name: Lint Ansible

# Callable, so the deploy can depend on it, and PR-triggered, so changes are checked
# before they reach main — where a push deploys itself.
on:
  workflow_call:
  pull_request:
    paths:
      - 'ansible/**'
      - '.github/workflows/ansible-lint.yml'
  workflow_dispatch:

# A superseded PR push is worth cancelling: this touches no host and only the newest
# commit's verdict matters. Not cancelled for a push to main, where this gates a deploy
# and killing it would fail the run that is converging. github.workflow is in the group
# so a called run — named after its caller — cannot cancel a PR's own lint, and so
# neither can collide with the vps-converge group and deadlock waiting on its caller.
concurrency:
  group: ansible-lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint and syntax-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Injected into the image's own ansible-core venv rather than pip-installed beside
      # it, so the lint and the syntax check below run against the very ansible-core and
      # bundled collections a deploy will use — instead of the second, collection-less
      # core that pip drags in as an ansible-lint dependency. --include-apps is what puts
      # the ansible-lint entry point on PATH.
      - name: Install ansible-lint
        run: pipx inject ansible-core ansible-lint --include-apps

      # Same seam as the deploy, for the same reason (see ansible-run.yml). Needed here
      # too, and not only inside ansible-lint: the syntax check below resolves modules on
      # its own, without ansible-lint's private collection cache.
      - name: Install any Ansible collection the runner image lacks
        working-directory: ansible
        run: ansible-galaxy collection install -r requirements.yml

      # Both checks run from ansible/ so ansible.cfg applies: its roles_path=./roles is
      # what makes the application role resolvable.
      #
      # Kept alongside ansible-lint (which runs its own syntax check) because the two
      # see different things: this assembles the real play graph but never parses
      # include_tasks targets, so tasks/read-manifest.yml is invisible to it.
      - name: Syntax-check playbooks
        working-directory: ansible
        run: |
          # -i only silences the empty-inventory warning; a syntax check never connects.
          ansible-playbook -i localhost, --syntax-check playbooks/deploy_apps.yml playbooks/update_packages.yml playbooks/podman_auto_update.yml

      # Lints every YAML file in the tree, dynamically included task files included.
      - name: Lint
        working-directory: ansible
        run: ansible-lint
